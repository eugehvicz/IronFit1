<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IronFit - Alunos</title>
    <link rel="stylesheet" href="internos.css">
</head>
<body>

<div class="pagina">

    <aside class="menu">
        <h1>IRON<span>FIT</span></h1>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="alunos.html" class="ativo">Alunos</a>
            <a href="personais.html">Personais</a>
            <a href="agendamentos.html">Agendamentos</a>
        </nav>

        <button id="btnSair">SAIR</button>
    </aside>

    <main class="conteudo">
        <h2>Gerenciamento de Alunos</h2>

        <div class="formulario">
            <h3>Cadastrar aluno</h3>

            <form id="formAluno">
                <label>Nome</label>
                <input type="text" id="nome" required>

                <label>CPF</label>
                <input type="text" id="cpf" maxlength="11" required>

                <label>Telefone</label>
                <input type="text" id="telefone">

                <label>E-mail</label>
                <input type="email" id="email">

                <label>Personal responsável</label>
                <select id="personal" required>
                    <option value="">Selecione um personal</option>
                </select>

                <button type="submit">CADASTRAR ALUNO</button>
            </form>

            <p id="mensagem"></p>
        </div>

        <h3>Alunos cadastrados</h3>

        <table class="tabela">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>CPF</th>
                    <th>Telefone</th>
                    <th>Personal</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="listaAlunos"></tbody>
        </table>
    </main>

</div>

<script src="alunos.js"></script>
</body>
</html>
