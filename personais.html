<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IronFit - Personais</title>
    <link rel="stylesheet" href="telasdedentro.css">
</head>
<body>

<div class="pagina">

    <aside class="menu">
        <h1>IRON<span>FIT</span></h1>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="alunos.html">Alunos</a>
            <a href="personais.html" class="ativo">Personais</a>
            <a href="agendamentos.html">Agendamentos</a>
        </nav>

        <button id="btnSair">SAIR</button>
    </aside>

    <main class="conteudo">
        <h2>Gerenciamento de Personais</h2>

        <div class="formulario">
            <h3>Cadastrar personal</h3>

            <form id="formPersonal">
                <label>Nome</label>
                <input type="text" id="nome" required>

                <label>CPF</label>
                <input type="text" id="cpf" maxlength="11" required>

                <label>Telefone</label>
                <input type="text" id="telefone">

                <label>E-mail</label>
                <input type="email" id="email" required>

                <button type="submit">CADASTRAR PERSONAL</button>
            </form>

            <p id="mensagem"></p>
        </div>

        <h3>Personais cadastrados</h3>

        <label>Pesquisar por nome</label>
        <input type="text" id="busca" placeholder="Digite o nome do personal">

        <table class="tabela">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Telefone</th>
                    <th>E-mail</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="listaPersonais"></tbody>
        </table>
    </main>

</div>
<div id="modalEditarPersonal" class="modal">
    <div class="modal-conteudo">

        <div class="modal-cabecalho">
            <h2>Editar personal</h2>

            <button type="button" class="fechar-modal" onclick="fecharModalPersonal()">
                ×
            </button>
        </div>

        <form id="formEditarPersonal">

            <input type="hidden" id="editarIdPersonal">

            <label for="editarNomePersonal">Nome</label>
            <input type="text" id="editarNomePersonal" required>

            <label for="editarTelefonePersonal">Telefone</label>
            <input type="text" id="editarTelefonePersonal">

            <label for="editarEmailPersonal">E-mail</label>
            <input type="email" id="editarEmailPersonal" required>

            <div class="modal-botoes">
                <button type="button" class="cancelar" onclick="fecharModalPersonal()">
                    Cancelar
                </button>

                <button type="submit" class="salvar">
                    Salvar alterações
                </button>
            </div>

        </form>
    </div>
</div>

<script src="personais.js"></script>
</body>
</html>
